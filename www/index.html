<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Защита Границы</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a; /* Тёмный фон вокруг */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            background-color: #0d1117; /* Цвет игрового поля */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border-bottom: 4px solid #ff4444; /* Красная линия — нижняя граница, которую защищаем */
        }
    </style>
</head>
<body>

    <!-- Наш игровой холст фиксированного размера (например, 800 на 600 пикселей) -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script src="app.js"></script>
</body>
</html>
